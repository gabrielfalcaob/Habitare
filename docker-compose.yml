services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: habitare
      MYSQL_USER: pw
      MYSQL_PASSWORD: "M3lhormateria!"
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/habitare?createDatabaseIfNotExist=TRUE"
      SPRING_DATASOURCE_USERNAME: pw
      SPRING_DATASOURCE_PASSWORD: "M3lhormateria!"
      API_SECURITY_TOKEN_SECRET: "segredo-de-demonstracao-troque-em-producao-0123456789"
    restart: on-failure
